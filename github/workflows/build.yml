name: Build All Variants

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [default, ru]
        include:
          - variant: default
            make_target: ""
            artifact_suffix: "EN"
          - variant: ru
            make_target: "ENABLE_RU=1"
            artifact_suffix: "RU"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          build-essential \
          python3 \
          python3-pip \
          git
        
        pip3 install --upgrade pip
        pip3 install crcmod
    
    - name: Build firmware - ${{ matrix.artifact_suffix }}
      run: |
        make clean || true
        make ${{ matrix.make_target }}
    
    - name: Rename artifacts
      run: |
        if [ -f firmware ]; then
          cp firmware firmware-${{ matrix.artifact_suffix }}
        fi
        if [ -f firmware.bin ]; then
          cp firmware.bin firmware-${{ matrix.artifact_suffix }}.bin
        fi
        if [ -f firmware.packed.bin ]; then
          cp firmware.packed.bin firmware-${{ matrix.artifact_suffix }}.packed.bin
        fi
    
    - name: Upload firmware - ${{ matrix.artifact_suffix }}
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.artifact_suffix }}-${{ github.sha }}
        path: |
          firmware-${{ matrix.artifact_suffix }}*
        if-no-files-found: warn
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          firmware-${{ matrix.artifact_suffix }}
          firmware-${{ matrix.artifact_suffix }}.bin
          firmware-${{ matrix.artifact_suffix }}.packed.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}