name: Build with Docker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t su75-builder .

      - name: Build in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            su75-builder \
            bash -c "git submodule update --init --recursive && make"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-docker
          path: |
            firmware
            firmware.bin
            firmware.packed.bin
          retention-days: 90
